appId: com.safebox.app
# 英文名用于可执行文件与安装目录，中文名用于快捷方式显示
productName: SafeBox
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
win:
  # 由 scripts/generate-icon.js 生成（多尺寸 PNG-in-ICO）
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 秘匣
  # ${version} 取自 package.json 的 version 字段，保持单一来源
  artifactName: SafeBox-Setup-${version}.${ext}
npmRebuild: false
